<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmation – Solid Ground Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .font-bebas { font-family: "Bebas Neue", sans-serif; }
      body { font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="SolidGround" />
<link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <main class="max-w-3xl mx-auto px-6 py-16">
      <h1 class="font-bebas text-5xl md:text-6xl mb-4">THANK YOU!</h1>
      <p class="text-lg text-gray-700 mb-8">
        If your payment was successful, you’ll receive a confirmation from our payment provider.
        If you don’t see it, check spam or contact us.
      </p>

      <div class="flex flex-col sm:flex-row gap-4">
        <a
          href="/tickets"
          class="inline-flex items-center justify-center bg-black text-white px-8 py-4 rounded-full font-bold hover:bg-gray-800 transition"
        >
          BACK TO TICKETS
        </a>
        <a
          href="/contact"
          class="inline-flex items-center justify-center border-2 border-black px-8 py-4 rounded-full font-bold hover:bg-black hover:text-white transition"
        >
          CONTACT
        </a>
      </div>
    </main>
  </body>
</html>
